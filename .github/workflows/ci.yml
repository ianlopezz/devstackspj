name: CI

on:
  pull_request:
    branches: [main]

jobs:
  test:
    name: Install Dependencies and Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: devtasks/package-lock.json
      - run: npm ci
        working-directory: ./devtasks
      - run: npm test
        working-directory: ./devtasks
